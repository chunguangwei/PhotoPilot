# 数据模型契约 v1
# 真源：04-工程规格书.md §3（类型/NULL/FK/on-delete 按 R12 裁决 2026-10-04 补全版）
# 本文件为机器可读契约，由 tools/check_contracts.py 校验；改动须同步更新 meta.expected 并复审。
meta:
  checksum: "5a5b7f2da56384288c793072460fe5b5b82526f66fa86a8a9c810a75aa03ca56"
  schema_version: 2
  source: "04-工程规格书.md §3"
  rulings: ["R01", "R02", "R04", "R06", "R08", "R10", "R12"]
  type_notation: ["str", "int", "bool", "blob"]
  global_rules:
    - "所有表含 created_at int NOT NULL、updated_at int NOT NULL（04 §3 前言；schema_meta 等未逐表列出的表也适用）"
    - "未标 NULL 即 NOT NULL（R12 裁决，2026-10-04）"
    - "所有外键显式注明 on-delete 动作"
    - "bool 以 0/1 存储"
  expected:
    table_count: 17
    column_count: 160
tables:
  - name: source
    source_ref: "04 §3.1"
    columns:
      - name: id
        type: str
        pk: true
      - name: type
        type: str
        values: ["local_photos", "local_files", "icloud_photos", "google_picker", "smb", "webdav"]
      - name: display_name
        type: str
        doc: "用户可改，不含凭证"
      - name: endpoint_key
        type: str
        null: true
        doc: "SMB/WebDAV 的 协议+主机+端口+共享 规范化串，不含用户名密码"
      - name: credential_ref
        type: str
        null: true
        doc: "安全存储别名，非机密本体"
      - name: account_key
        type: str
        null: true
        doc: "来源账号绑定（如 Google account sub 的本地哈希）；系统来源为 NULL（R12 裁决）"
      - name: capability_flags
        type: int
        doc: "位掩码，见 04 §6.1（contracts/capability-flags.yaml）"
      - name: retention_policy
        type: str
        values: ["user_managed", "policy_gated"]
        doc: "Google 默认 policy_gated"
      - name: status
        type: str
        values: ["active", "needs_auth", "unavailable", "disconnected"]
      - name: epoch
        type: int
        default: 1
        doc: "来源级代号，见 04 §8"
      - name: last_sync_at
        type: int
        null: true
        doc: "最近一次成功完整扫描"
      - name: settings_json
        type: str
        null: true
        doc: "递归开关、镜像删除开关等"
      - name: created_at
        type: int
      - name: updated_at
        type: int
    unique_constraints:
      - columns: ["type", "endpoint_key"]
        partial: "endpoint_key IS NOT NULL"
        doc: "阻止重复添加同一台 NAS"
  - name: source_asset
    source_ref: "04 §3.2"
    columns:
      - name: id
        type: str
        pk: true
      - name: source_id
        type: str
        fk: {table: source, column: id, on_delete: CASCADE}
      - name: remote_key
        type: str
        doc: "NAS 为相对路径；Google 为本次选择项标识；PhotoKit 为本地标识符"
      - name: stable_id
        type: str
        null: true
        doc: "来源提供的稳定 ID（如可得）"
      - name: revision
        type: str
        doc: "mtime:size 或来源版本串"
      - name: byte_size
        type: int
        null: true
      - name: remote_taken_at
        type: int
        null: true
      - name: last_seen_at
        type: int
        doc: "最近一次扫描见到"
      - name: missing_scan_count
        type: int
        default: 0
        doc: "连续缺失次数，见 04 §9.2"
      - name: access_state
        type: str
        values: ["accessible", "unauthorized", "missing", "removed"]
      - name: created_at
        type: int
      - name: updated_at
        type: int
    unique_constraints:
      - columns: ["source_id", "remote_key"]
    indexes:
      - columns: ["source_id", "last_seen_at"]
      - columns: ["stable_id"]
  - name: asset
    source_ref: "04 §3.3"
    columns:
      - name: id
        type: str
        pk: true
      - name: content_hash
        type: str
        doc: "见 04 §4"
      - name: byte_size
        type: int
      - name: format
        type: str
        values: ["jpeg", "png", "heic", "mp4", "mov", "dng", "cr2", "nef", "arw", "raf", "orf", "rw2"]
      - name: pixel_width
        type: int
        doc: "EXIF 校正后的显示宽"
      - name: pixel_height
        type: int
        doc: "EXIF 校正后的显示高"
      - name: exif_orientation
        type: int
        doc: "1–8 原始值，仅作记录"
      - name: orientation_class
        type: str
        values: ["landscape", "portrait", "square"]
