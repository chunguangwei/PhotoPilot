      - name: imported_at
        type: int
      - name: policy_state
        type: str
        values: ["allowed", "gated", "revoked"]
      - name: origin_state
        type: str
        default: active
        values: ["active", "detached"]
        doc: "detached 不参与来源政策检查（R01 裁决）"
      - name: created_at
        type: int
      - name: updated_at
        type: int
    primary_key: ["asset_id", "source_asset_id"]
    doc: "一个 asset 可有多个来源（PRD §4.1 撤权判定依赖此表）"
  - name: collection
    source_ref: "04 §3.5"
    columns:
      - name: id
        type: str
        pk: true
      - name: parent_id
        type: str
        null: true
        fk: {table: collection, column: id, on_delete: RESTRICT}
        doc: "删除目录前须先处理子目录或先移走"
      - name: source_id
        type: str
        null: true
        fk: {table: source, column: id, on_delete: CASCADE}
        doc: "用户自建目录为 NULL"
      - name: name
        type: str
        doc: "显示名"
      - name: rel_path
        type: str
        null: true
        doc: "NAS 相对路径，用于递归匹配"
      - name: type
        type: str
        values: ["source_folder", "import_batch", "album_map", "user_folder"]
      - name: sort_key
        type: str
        doc: "稳定排序键"
      - name: created_at
        type: int
      - name: updated_at
        type: int
    unique_constraints:
      - columns: ["source_id", "rel_path"]
    checks:
      - "插入前校验 parent_id 不指向自身子树（防环，应用层校验）"
  - name: collection_asset
    source_ref: "04 §3.5"
    columns:
      - name: collection_id
        type: str
        fk: {table: collection, column: id, on_delete: CASCADE}
      - name: asset_id
        type: str
        fk: {table: asset, column: id, on_delete: CASCADE}
      - name: created_at
        type: int
      - name: updated_at
        type: int
    primary_key: ["collection_id", "asset_id"]
    indexes:
      - columns: ["asset_id"]
    doc: "二元组均 NOT NULL。04 §3.5 以 collection_asset(collection_id, asset_id) 表述该二元组，本契约据此显式声明复合主键，保证同一目录内同一 asset 仅一行；无代理键"
  - name: frame
