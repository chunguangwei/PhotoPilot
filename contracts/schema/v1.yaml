      - name: captured_at
        type: int
        null: true
        doc: "无 EXIF 时为 NULL，不用导入时间冒充"
      - name: media_kind
        type: str
        default: image
        values: ["image", "video"]
        doc: "视频为 video（P1，2026-10-08 冻结）；既有行默认 image"
      - name: duration_ms
        type: int
        null: true
        doc: "视频时长毫秒；图片为 NULL"
      - name: captured_at_source
        type: str
        values: ["exif", "container", "unknown"]
      - name: imported_at
        type: int
      - name: original_rel_path
        type: str
        doc: "相对 originals/"
      - name: original_file_name
        type: str
        null: true
        doc: "来源文件名，仅用于搜索与展示"
      - name: readiness
        type: str
        values: ["ready", "pending", "failed", "deleted"]
      - name: failure_code
        type: str
        null: true
        doc: "见 04 §10（contracts/error-codes.yaml）"
      - name: privacy_excluded
        type: bool
        default: 0
        doc: "全局隐藏"
      - name: edge_color
        type: str
        null: true
        doc: "sRGB hex，供 fit_color 补边；采样失败为 NULL，回退 surface.canvas（R06 裁决）"
      - name: deleted_at
        type: int
        null: true
        doc: "逻辑删除时间，撤销窗口内可恢复"
      - name: created_at
        type: int
      - name: updated_at
        type: int
    unique_constraints:
      - columns: ["content_hash"]
        partial: "readiness != 'deleted'"
        doc: "部分索引实现"
    indexes:
      - columns: ["captured_at", "id"]
      - columns: ["readiness"]
      - columns: ["orientation_class"]
      - columns: ["original_file_name"]
  - name: asset_origin
    source_ref: "04 §3.4"
    columns:
      - name: asset_id
        type: str
        pk: true
        fk: {table: asset, column: id, on_delete: CASCADE}
      - name: source_asset_id
        type: str
        pk: true
        fk: {table: source_asset, column: id, on_delete: NO ACTION}
