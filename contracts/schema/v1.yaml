      - name: name
        type: str
      - name: cover_asset_id
        type: str
        null: true
        fk: {table: asset, column: id, on_delete: SET NULL}
      - name: settings_json
        type: str
        doc: "校验后写入，未知字段保留以便前向兼容；结构见 04 §3.6"
      - name: selection_version
        type: int
        default: 0
      - name: order_mode
        type: str
        values: ["captured_asc", "random", "manual"]
      - name: random_seed
        type: int
        default: 0
      - name: created_at
        type: int
      - name: updated_at
        type: int
  - name: frame_selection
    source_ref: "04 §3.6"
    columns:
      - name: frame_id
        type: str
        fk: {table: frame, column: id, on_delete: CASCADE}
      - name: asset_id
        type: str
        null: true
        fk: {table: asset, column: id, on_delete: CASCADE}
      - name: source_asset_id
        type: str
        null: true
        fk: {table: source_asset, column: id, on_delete: CASCADE}
        doc: "引用提交前身份（待下载占位）（R02 裁决）"
      - name: mode
        type: str
        values: ["include", "exclude"]
      - name: manual_order
        type: int
        null: true
      - name: added_at
        type: int
      - name: ref_key
        type: str
        derived: true
        doc: "派生列：ref_key = COALESCE(asset_id, source_asset_id)，由 CHECK 保证恰一非空故结果唯一且 NOT NULL。平台实现为生成列或插入/更新时同事务写入并禁止外部直接改写；R02 重指向时在同事务内由 source_asset_id 改为 asset_id 并保留 manual_order"
      - name: created_at
        type: int
      - name: updated_at
        type: int
    primary_key: ["frame_id", "ref_key"]
    derived_key_columns: ["ref_key"]
    checks:
      - "CHECK ((asset_id IS NULL) != (source_asset_id IS NULL))"
      - "ref_key 为 asset_id 与 source_asset_id 中恰一个非空者（派生列）"
      - "ref_key = COALESCE(asset_id, source_asset_id)，不得由调用方自定义取值"
  - name: frame_directory_rule
    source_ref: "04 §3.6"
    columns:
