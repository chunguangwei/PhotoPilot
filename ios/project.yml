name: PhotoPilot
options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "27.0"
  developmentLanguage: en
  knownRegions:
    - en
    - zh-Hans
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
packages:
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2
    from: 4.0.3
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "2"
    MARKETING_VERSION: "1.1.46"
    CURRENT_PROJECT_VERSION: "46"
targets:
  PhotoPilot:
    type: application
    platform: iOS
    sources:
      - path: PhotoPilot/App
      - path: PhotoPilot/Data
      - path: PhotoPilot/Domain
      - path: PhotoPilot/Render
      - path: PhotoPilot/UI
      - path: PhotoPilot/Resources
        excludes:
          - Info.plist
    dependencies:
      - package: AMSMB2
        product: AMSMB2
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.photopilot.scaffold
        PRODUCT_NAME: PhotoPilot
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: L35RLT89XN
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: PhotoPilot/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  PhotoPilotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhotoPilotTests
      - path: ../contracts/vectors/import-job-aggregate.json
        buildPhase: resources
      - path: ../contracts/vectors/import-signal-effects.json
        buildPhase: resources
      - path: ../contracts/vectors/fixture-enumeration.json
        buildPhase: resources
      - path: ../contracts/vectors/tombstone-match.json
        buildPhase: resources
      - path: ../contracts/vectors/selection-resolve.json
        buildPhase: resources
      - path: ../contracts/vectors/playback-queue.json
        buildPhase: resources
      - path: ../contracts/vectors/selection-save.json
        buildPhase: resources
      - path: ../contracts/vectors/playback-state.json
        buildPhase: resources
      - path: ../contracts/vectors/playback-timing.json
        buildPhase: resources
      - path: ../contracts/vectors/render-geometry.json
        buildPhase: resources
      - path: ../contracts/vectors/nas-address.json
        buildPhase: resources
      - path: ../contracts/vectors/nas-path.json
        buildPhase: resources
      - path: ../contracts/vectors/nas-deletion.json
        buildPhase: resources
      - path: ../contracts/vectors/nas-sync-diff.json
        buildPhase: resources
      - path: ../contracts/vectors/nas-enum-cursor.json
        buildPhase: resources
      - path: ../contracts/vectors/launch-presentation.json
        buildPhase: resources
      - path: ../contracts/vectors/holiday-windows.json
        buildPhase: resources
      - path: ../contracts/vectors/weather-location-follow.json
        buildPhase: resources
      - path: ../contracts/vectors/weather-location-preserve.json
        buildPhase: resources
    dependencies:
      - target: PhotoPilot
    settings:
      base:
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: "YES"
  PhotoPilotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PhotoPilotUITests
        excludes:
          - SeedMedia
    dependencies:
      - target: PhotoPilot
    settings:
      base:
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: PhotoPilot
schemes:
  PhotoPilot:
    build:
      targets:
        PhotoPilot: all
        PhotoPilotTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PhotoPilotTests
    analyze:
      config: Debug
    archive:
      config: Release
  PhotoPilotScreenshots:
    build:
      targets:
        PhotoPilot: all
        PhotoPilotUITests: [test]
    test:
      config: Debug
      targets:
        - PhotoPilotUITests
      environmentVariables:
        - variable: SCREENSHOT_DIR
          value: "$(SRCROOT)/../store/appstore/raw"
  PhotoPilotWalkthrough:
    build:
      targets:
        PhotoPilot: all
        PhotoPilotUITests: [test]
    test:
      config: Debug
      targets:
        - PhotoPilotUITests
      environmentVariables:
        - variable: SCREENSHOT_DIR
          value: "$(SRCROOT)/../.build/walkthrough"
