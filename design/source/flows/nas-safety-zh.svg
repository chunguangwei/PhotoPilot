horization.</text><g id="Annotations" display="none"><desc>{"interactive": false, "externalUI": "Official browser/system surfaces are external nodes, not simulated screens"}</desc><rect x="32" y="24" width="1036" height="1272" fill="none" stroke="#6A5431" data-token="accent.action"/></g></svg>