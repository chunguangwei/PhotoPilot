n="type/caption" data-string-key="design.storage_threshold_help">默认保留至少 1 GB 或总容量的 5%，取较大值。低于阈值暂停导入，不自动删除照片。</text><rect x="120.0" y="352" width="616" height="50" rx="12" fill="#FCFAF6" fill-opacity="1" data-token="surface.panel" stroke="#DDDCD4" stroke-width="1" data-stroke-token="separator"/><text x="411.00" y="381.00" font-family="PingFang SC, sans-serif" font-size="17" fill="#202321" data-token="text.primary" data-type-token="type/body" data-string-key="common.edit">编辑</text><text x="120.00" y="439.00" font-family="PingFang SC, sans-serif" font-size="17" fill="#202321" data-token="text.primary" data-type-token="type/body" data-string-key="design.import_originals">保留导入原文件，按需生成展示副本</text><rect x="676.0" y="422" width="56" height="32" rx="16" fill="#DDDCD4" fill-opacity="1" data-token="separator"/><ellipse cx="716.0" cy="438.0" rx="12.0" ry="12.0" fill="#FCFAF6" data-token="surface.panel"/><text x="120.00" y="500.00" font-family="PingFang SC, sans-serif" font-size="22" fill="#202321" data-token="text.primary" data-type-token="type/heading" data-string-key="settings.network">网络与同步</text><text x="120.00" y="552.00" font-family="PingFang SC, sans-serif" font-size="17" fill="#202321" data-token="text.primary" data-type-token="type/body" data-string-key="settings.wifi_only">仅在 Wi-Fi 下下载</text><rect x="676.0" y="535" width="56" height="32" rx="16" fill="#6A5431" fill-opacity="1" data-token="accent.action"/><ellipse cx="716.0" cy="551.0" rx="12.0" ry="12.0" fill="#FCFAF6" data-token="surface.panel"/><rect x="120.0" y="591" width="616" height="50" rx="12" fill="#FCFAF6" fill-opacity="1" data-token="surface.panel" stroke="#DDDCD4" stroke-width="1" data-stroke-token="separator"/><text x="360.00" y="620.00" font-family="PingFang SC, sans-serif" font-size="17" fill="#202321" data-token="text.primary" data-type-token="type/body" data-string-key="import.use_cellular">使用蜂窝数据下载</text><text x="120.00" y="678.00" font-family="PingFang SC, sans-serif" font-size="17" fill="#202321" da